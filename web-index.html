<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Mystery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #020304;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: monospace;
      overflow: hidden;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #020304;
      color: #33e052;
      gap: 16px;
      z-index: 10;
    }
    #loading h1 { font-size: 1.4rem; letter-spacing: 0.18em; text-shadow: 0 0 12px #33e05288; }
    #loading-bar-wrap {
      width: 280px; height: 4px;
      background: #0a1a0a; border-radius: 2px; overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%;
      background: #33e052;
      box-shadow: 0 0 8px #33e052;
      border-radius: 2px;
      transition: width 0.2s ease;
    }
    #loading-msg { font-size: 0.72rem; color: #33e05266; }
    #canvas {
      display: none;
      image-rendering: pixelated;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>=== TERMINAL MYSTERY ===</h1>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-msg">Loading...</div>
  </div>
  <!-- tabindex makes the canvas focusable so keyboard events reach love.js -->
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var canvas = document.getElementById("canvas");

    function focusCanvas() { canvas.focus(); }
    window.onload  = focusCanvas;
    window.onclick = focusCanvas;
    canvas.addEventListener("click", focusCanvas);

    // Only block arrow keys (page scroll); let space and Enter reach the game
    window.addEventListener("keydown", function(e) {
      if ([37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, false);

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 67108864,
      printErr: console.error.bind(console),
      canvas: (function() {
        canvas.addEventListener("webglcontextlost", function(e) {
          alert("WebGL context lost. Please reload."); e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (text) {
          var m = text.match(/\((\d+)\/(\d+)\)/);
          if (m) {
            document.getElementById("loading-bar").style.width =
              (parseInt(m[1]) / parseInt(m[2]) * 100) + "%";
          }
          document.getElementById("loading-msg").textContent = text;
        } else if (Module.remainingDependencies === 0) {
          document.getElementById("loading").style.display = "none";
          canvas.style.display = "block";
          setTimeout(focusCanvas, 50);
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")"
          : "All downloads complete.");
      }
    };

    Module.setStatus("Downloading...");
    window.onerror = function() {
      Module.setStatus("Error — see browser console");
      Module.setStatus = function(t) { if (t) console.error("[post-exception]", t); };
    };

    var applicationLoad = function() { Love(Module); };
  </script>
  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad()"></script>
</body>
</html>
